name: Validate and Deploy DAGs to MWAA

on:
  push:
    branches:
      - main
    paths:
      - 'dags/**'
      - 'tests/**'
  pull_request:
    branches:
      - main
    paths:
      - 'dags/**'
      - 'tests/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  # Job 1: Test and Validate DAG Code Stability
  validate-dags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-node-version: '3.11' # Match your MWAA environment's Python version
          cache: 'pip'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install core airflow packages needed for compilation and structural parsing
          pip install apache-airflow boto3 pytest

      - name: Run Airflow DAG Integrity Tests
        env:
          # Set PYTHONPATH to include the dags folder so local module imports resolve seamlessly
          PYTHONPATH: ${{ github.workspace }}/dags
        run: |
          pytest tests/*.py

  # Job 2: Continuous Deployment (Executes ONLY if Validation Passes)
  deploy-dags:
    needs: validate-dags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: "arn:aws:iam::932021957888:role/github-actions-terraform-role"
          aws-region: us-east-1

      - name: Sync DAGs to MWAA S3 Bucket
        run: |
          aws s3 sync dags/ s3://enterprise-data-gov-mwaa-dags-prod/dags/ --delete