# .github/workflows/terraform-pipeline.yml
name: "Enterprise Terraform CI/CD"

on:
  push:
    branches:
      - main
    paths:
      - 'infrastructure/**' # Only trigger if infra files change
  pull_request:
    branches:
      - main
    paths:
      - 'infrastructure/**'

permissions:
  id-token: write # Mandatory for acquiring AWS OIDC credentials
  contents: read  # Mandatory for checking out code
  pull-requests: write # Allows PR comments with plan outputs

env:
  AWS_REGION: "us-east-1"
  ROLE_TO_ASSUME: "arn:aws:iam::932021957888:role/github-actions-terraform-role"

jobs:
  terraform:
    name: "Terraform Core Lifecycle"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./infrastructure

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Authenticate securely with AWS via OIDC Token Exchange
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          

      # Step 3: Set up the specific version of Terraform CLI
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      # Step 4: Validate formatting compliance
      - name: Terraform Format Check
        run: terraform fmt -check

      # Step 5: Initialize backend and download provider plugins
      - name: Terraform Init
        run: terraform init

      # Step 6: Validate syntax configuration
      - name: Terraform Validate
        run: terraform validate

      # Step 7: Generate Execution Plan
      - name: Terraform Plan
        id: plan
        run: terraform plan -var="environment=prod" -no-color
        continue-on-error: false

      # Step 8: Post Plan results back into Pull Request for peer review
      - name: Update Pull Request with Plan Output
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `#### Terraform Plan Status: 🚀 Success
            *Pushed by: @${context.actor}*`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      # Step 9: Execute structural deployments only on main branch merges
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -var="environment=prod" -auto-approve
        