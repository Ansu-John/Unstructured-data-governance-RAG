[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Project Metadata (PEP 621) ────────────────────────────────────────────

[project]
name = "ai-data-catalog-agent"
version = "1.0.0"
description = "Enterprise AI-Driven Data Quality & Cataloging Agent — Medallion Architecture, LangGraph orchestration, Great Expectations validation, pgvector semantic search"
authors = [
    { name = "Ansu", email = "ansu@example.com" },
]
maintainers = [
    { name = "Ansu", email = "ansu@example.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.15"

keywords = [
    "data-quality",
    "data-catalog",
    "langgraph",
    "pyspark",
    "great-expectations",
    "pgvector",
    "medallion-architecture",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # ── Graph Orchestration ─────────────────────────────────────────────────
    "langgraph>=0.2.0,<0.3.0",
    "langgraph-checkpoint-postgres>=2.0.0,<3.0.0",
    # ── Data Processing ─────────────────────────────────────────────────────
    "pyspark>=3.5.0,<4.0.0",
    "great-expectations>=1.0.0,<2.0.0",
    # ── Database & Vector Store ─────────────────────────────────────────────
    "psycopg2-binary>=2.9.9,<3.0.0",
    "pgvector>=0.2.5,<0.3.0",
    "alembic>=1.13.0,<2.0.0",
    "sqlalchemy>=2.0.25,<3.0.0",
    # ── AWS Integration ─────────────────────────────────────────────────────
    "boto3>=1.34.0,<2.0.0",
    "botocore>=1.34.0,<2.0.0",
    # ── LLM Resilience ──────────────────────────────────────────────────────
    "tenacity>=8.2.3,<9.0.0",
    # ── Telemetry & Observability ──────────────────────────────────────────
    "opentelemetry-api>=1.24.0,<2.0.0",
    "opentelemetry-sdk>=1.24.0,<2.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.24.0,<2.0.0",
    # ── Configuration ───────────────────────────────────────────────────────
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    # ── Transformations ─────────────────────────────────────────────────────
    "dbt-postgres>=1.8.0,<2.0.0",
    "psycopg-binary>=3.3.4",
]

[project.urls]
Homepage = "https://github.com/your-org/ai-data-catalog-agent"
Repository = "https://github.com/your-org/ai-data-catalog-agent"
Documentation = "https://github.com/your-org/ai-data-catalog-agent/docs"
"Bug Tracker" = "https://github.com/your-org/ai-data-catalog-agent/issues"
Changelog = "https://github.com/your-org/ai-data-catalog-agent/releases"

[project.scripts]
# CLI entry points
ai-catalog-agent = "src.agents.graph_builder:main"
run-quality-check = "src.data_pipeline.quality.gx_suites:main"

# ── Development Dependency Groups (PEP 735 via uv) ─────────────────────────

[dependency-groups]
dev = [
    # ── Testing ─────────────────────────────────────────────────────────────
    "pytest>=8.1.0,<9.0.0",
    "pytest-cov>=5.0.0,<6.0.0",
    "pytest-mock>=3.14.0,<4.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",

    # ── Linting & Formatting ────────────────────────────────────────────────
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.9.0,<2.0.0",

    # ── Pre-commit ──────────────────────────────────────────────────────────
    "pre-commit>=3.6.0,<4.0.0",

    # ── Local Dev ───────────────────────────────────────────────────────────
    "ipython>=8.22.0,<9.0.0",
    "jupyter>=1.0.0,<2.0.0",
]

# ── Testing Configuration ──────────────────────────────────────────────────

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: marks tests as asyncio-compatible",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__init__.py",
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if HAS_OTEL:",
    "except ImportError:",
    "except Exception as exc:",
]

# ── Code Quality ───────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "S101"]
"infrastructure/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = false
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false

# ── Build Configuration ────────────────────────────────────────────────────

[tool.hatch.build.targets.wheel]
packages = ["src"]
