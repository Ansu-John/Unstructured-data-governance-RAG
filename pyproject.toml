[build-system]
requires = ["poetry-core>=1.9"]
build-backend = "poetry.core.masonry.api"

[tool]
[tool.poetry]
name = "ai-data-catalog-agent"
version = "1.0.0"
description = "Enterprise AI-Driven Data Quality & Cataloging Agent — Medallion Architecture, LangGraph orchestration, Great Expectations validation, pgvector semantic search"
authors = [
    "Ansu <ansu@example.com>",
]
maintainers = [
    "Ansu <ansu@example.com>",
]
package-mode = false
license = "MIT"
readme = "README.md"
homepage = "https://github.com/your-org/ai-data-catalog-agent"
repository = "https://github.com/your-org/ai-data-catalog-agent"
documentation = "https://github.com/your-org/ai-data-catalog-agent/docs"
keywords = ["data-quality", "data-catalog", "langgraph", "pyspark", "great-expectations", "pgvector", "medallion-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"

# ── Graph Orchestration ─────────────────────────────────────────────────
langgraph = "^0.2.0"
langgraph-checkpoint-postgres = "^2.0.0"

# ── Data Processing ─────────────────────────────────────────────────────
pyspark = "^3.5.0"
great-expectations = "^1.0.0"

# ── Database & Vector Store ─────────────────────────────────────────────
psycopg2-binary = "^2.9.9"
pgvector = "^0.2.5"
alembic = "^1.13.0"
sqlalchemy = "^2.0.25"

# ── AWS Integration ─────────────────────────────────────────────────────
boto3 = "^1.34.0"
botocore = "^1.34.0"

# ── LLM Resilience ──────────────────────────────────────────────────────
tenacity = "^8.2.3"

# ── Telemetry & Observability ──────────────────────────────────────────
opentelemetry-api = "^1.24.0"
opentelemetry-sdk = "^1.24.0"
opentelemetry-exporter-otlp-proto-http = "^1.24.0"

# ── Configuration ───────────────────────────────────────────────────────
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"

# ── Transformations (dbt is a separate binary, but adapter is Python) ───
dbt-postgres = "^1.8.0"

[tool.poetry.group.dev.dependencies]
# ── Testing ─────────────────────────────────────────────────────────────
pytest = "^8.1.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
pytest-asyncio = "^0.23.0"

# ── Linting & Formatting ────────────────────────────────────────────────
ruff = "^0.4.0"
mypy = "^1.9.0"

# ── Pre-commit ──────────────────────────────────────────────────────────
pre-commit = "^3.6.0"

# ── Local Dev ───────────────────────────────────────────────────────────
ipython = "^8.22.0"
jupyter = "^1.0.0"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "asyncio: marks tests as asyncio-compatible",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/__init__.py",
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if HAS_OTEL:",
    "except ImportError:",
    "except Exception as exc:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["ARG001", "S101"]
"infrastructure/**" = ["ALL"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = false
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.poetry.scripts]
# CLI entry points
ai-catalog-agent = "src.agents.graph_builder:main"
run-quality-check = "src.data_pipeline.quality.gx_suites:main"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/your-org/ai-data-catalog-agent/issues"
"Changelog" = "https://github.com/your-org/ai-data-catalog-agent/releases"